services:
  # -------------------------------------------------------------
  # Base de Datos: PostgreSQL
  # -------------------------------------------------------------
  postgres-db:
    image: postgres:16-alpine
    container_name: minibank-postgres
    environment:
      POSTGRES_DB: minibank
      POSTGRES_USER: emilio
      POSTGRES_PASSWORD: supersecretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emilio -d minibank"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Aplicación: Tu API Spring Boot
  # -------------------------------------------------------------
  minibank-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minibank-app
    ports:
      - "9000:9000"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/minibank
      - SPRING_DATASOURCE_USERNAME=emilio
      - SPRING_DATASOURCE_PASSWORD=supersecretpassword
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  pgdata:
    driver: local