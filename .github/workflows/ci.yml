name: CI - MiniBank Pipeline

# 1. Cuándo se ejecuta: cada vez que hacés un push a la rama 'main'
on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    # 2. Dónde corre: en una máquina virtual de Ubuntu limpia provista por GitHub
    runs-on: ubuntu-latest

    # Permisos necesarios para que el pipeline pueda escribir/subir la imagen GHCR
    permissions:
      contents: read
      packages: write

    # Levantamos el contenedor de Postgres real en la máquina de GitHub
    services:
      postgres-db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: minibank
          POSTGRES_USER: emilio
          POSTGRES_PASSWORD: supersecretpassword
        ports:
          - 5432:5432
        # Monitoreamos que Postgres esté 100% listo antes de pasar a los steps
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5    

    steps:
    # Paso A: Clonar tu código del repositorio en la máquina virtual
    - name: Checkout del código
      uses: actions/checkout@v4

    # Paso B: Configurar el entorno de Java 21
    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven' # Esto guarda las dependencias para que el próximo build sea rápido

    # Paso C: Compilar y ejecutar los tests automáticos con Maven
    - name: Compilar y testear con Maven
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/minibank
        SPRING_DATASOURCE_USERNAME: emilio
        SPRING_DATASOURCE_PASSWORD: supersecretpassword
      run: mvn clean package

    # -------------------------------------------------------------
    # NUEVO: Fase de Dockerización Automática (GHCR)
    # -------------------------------------------------------------

    # Paso 1: Loguearse en GitHub Container Registry de forma segura
    - name: Iniciar sesión en GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Paso 2: Construir la imagen usando tu Dockerfile local y subirla (Push)
    - name: Construir y Subir Imagen Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        # Convierte el nombre a minúsculas automáticamente para evitar errores de tags en GitHub
        tags: |
          ghcr.io/${{ github.repository_owner }}/minibank-api:latest