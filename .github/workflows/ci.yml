name: CI - MiniBank Pipeline

# 1. Cuándo se ejecuta: cada vez que hacés un push a la rama 'main'
on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    # 2. Dónde corre: en una máquina virtual de Ubuntu limpia provista por GitHub
    runs-on: ubuntu-latest

    steps:
    # Paso A: Clonar tu código del repositorio en la máquina virtual
    - name: Checkout del código
      uses: actions/checkout@v4

    # Paso B: Configurar el entorno de Java 21
    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven' # Esto guarda las dependencias para que el próximo build sea rápido

    # Paso C: Compilar y ejecutar los tests automáticos con Maven
    - name: Compilar y testear con Maven
      run: mvn clean package