spring:
  application:
    name: minibank-api

  # Configuración de la conexión real a tu contenedor Postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Mantenemos solo Kafka excluido si aún no lo configuraste,
  # pero liberamos DataSource para que JPA funcione.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

server:
  port: 9000
  threads:
    virtual:
      enabled: true