spring:
  application:
    name: minibank-api

  # Conexión configurada con variables de entorno para Docker Compose
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/minibank}
    username: ${SPRING_DATASOURCE_USERNAME:emilio}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # Inicialización por Script SQL (Le indica a Spring dónde buscar tu DDL)
  sql:
    init:
      mode: always
      schema-locations: classpath:postgre/schema.sql # Ajustado a la carpeta 'postgre' y archivo 'schema.sql'

  jpa:
    hibernate:
      ddl-auto: none # Desactivado el DDL automático de Hibernate, ahora manda tu script SQL
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true # Formatea el SQL en la consola para que sea legible

# Configuración de SpringDoc / Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true

server:
  port: 9000
  threads:
    virtual:
      enabled: true # Explotando los Virtual Threads de Java 21