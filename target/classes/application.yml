spring:
  application:
    name: minibank-api

  # Movemos las exclusiones a la raíz del bloque spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

server:
  port: 9000
  # Activamos hilos virtuales para que Spring use un pool liviano por cada request HTTP
  threads:
    virtual:
      enabled: true